{% extends "base.html" %}
{% block body %}
<h1>That file could not be used</h1>
<p class="sub">{{ message }}</p>
{% if details %}
<div class="panel"><ul class="small">{% for d in details %}<li>{{ d }}</li>{% endfor %}</ul></div>
{% endif %}
<a class="btn primary" href="{{ url_for('index') }}">Try another file</a>
{% endblock %}
