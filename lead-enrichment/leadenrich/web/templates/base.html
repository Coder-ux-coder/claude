<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Lead Enrichment{% endblock %}</title>
<style>
  :root {
    --bg:#f6f7f9; --panel:#ffffff; --ink:#16191d; --muted:#5f6b7a;
    --line:#e2e6ea; --accent:#1f6feb; --accent-ink:#ffffff;
    --ok:#1a7f4b; --warn:#9a6400; --bad:#b3261e;
    --ok-bg:#e8f5ee; --warn-bg:#fdf3e0; --bad-bg:#fbeceb;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1216; --panel:#171b21; --ink:#e8eaed; --muted:#9aa5b1;
      --line:#272d35; --accent:#4c8dff;
      --ok:#5fd39b; --warn:#e0b357; --bad:#f2867d;
      --ok-bg:#12271d; --warn-bg:#2a2213; --bad-bg:#2a1817;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { background:var(--panel); border-bottom:1px solid var(--line); }
  .wrap { max-width:1180px; margin:0 auto; padding:0 20px; }
  header .wrap { display:flex; align-items:center; gap:22px; height:58px; }
  .brand { font-weight:650; letter-spacing:-.01em; }
  .brand span { color:var(--muted); font-weight:400; }
  nav a { color:var(--muted); text-decoration:none; margin-right:16px; font-size:14px; }
  nav a:hover, nav a.on { color:var(--accent); }
  main { padding:26px 0 60px; }
  h1 { font-size:24px; margin:0 0 6px; letter-spacing:-.015em; }
  h2 { font-size:17px; margin:26px 0 10px; letter-spacing:-.01em; }
  .sub { color:var(--muted); margin:0 0 22px; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:var(--radius); padding:20px; margin-bottom:18px; }
  .grid { display:grid; gap:18px; }
  @media (min-width:860px) { .grid.two { grid-template-columns:1.25fr .9fr; } }
  button, .btn {
    font:inherit; font-weight:550; padding:10px 18px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    cursor:pointer; text-decoration:none; display:inline-block;
  }
  button.primary, .btn.primary { background:var(--accent); color:var(--accent-ink);
                                 border-color:transparent; }
  button:hover, .btn:hover { filter:brightness(1.06); }
  input[type=text], input[type=number], input[type=file] {
    font:inherit; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--ink); width:100%;
  }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 5px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; font-weight:600; color:var(--muted); font-size:12px;
       text-transform:uppercase; letter-spacing:.04em;
       padding:8px 10px; border-bottom:1px solid var(--line); }
  td { padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  .scroll { overflow-x:auto; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px;
          font-size:11.5px; font-weight:600; white-space:nowrap; }
  .pill.ok { background:var(--ok-bg); color:var(--ok); }
  .pill.warn { background:var(--warn-bg); color:var(--warn); }
  .pill.bad { background:var(--bad-bg); color:var(--bad); }
  .muted { color:var(--muted); }
  .small { font-size:12.5px; }
  code { background:var(--bg); border:1px solid var(--line); border-radius:5px;
         padding:1px 5px; font-size:12.5px; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px;
        padding:12px; overflow-x:auto; font-size:12.5px; }
  .bar { height:7px; background:var(--line); border-radius:99px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); width:0;
             transition:width .3s ease; }
  .steps { counter-reset:s; list-style:none; padding:0; margin:0; }
  .steps li { counter-increment:s; position:relative; padding:0 0 14px 34px; }
  .steps li::before {
    content:counter(s); position:absolute; left:0; top:0;
    width:23px; height:23px; border-radius:50%; background:var(--accent);
    color:var(--accent-ink); font-size:12px; font-weight:650;
    display:grid; place-items:center;
  }
  .note { border-left:3px solid var(--accent); padding:10px 14px;
          background:var(--bg); border-radius:0 8px 8px 0; margin:14px 0; }
  .note.warn { border-left-color:var(--warn); }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">Lead Enrichment <span>/ clinic decision-makers</span></div>
  <nav>
    <a href="{{ url_for('index') }}" class="{{ 'on' if request.endpoint=='index' }}">Run</a>
    <a href="{{ url_for('setup') }}" class="{{ 'on' if request.endpoint=='setup' }}">Setup</a>
  </nav>
</div></header>
<main><div class="wrap">{% block body %}{% endblock %}</div></main>
</body>
</html>
