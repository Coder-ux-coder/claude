<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair this device with Crew</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.6 "Segoe UI", system-ui, Roboto, sans-serif;
         background: #F4F6F5; color: #15201B; }
  @media (prefers-color-scheme: dark) { body { background: #0D1210; color: #E7EEEA; } .muted { color: #93A19A !important; } .card { background: #141B18 !important; border-color: #25302B !important; } }
  main { max-width: 460px; padding: 24px; }
  .card { background: #fff; border: 1px solid #E1E7E3; border-radius: 20px; padding: 26px; box-shadow: 0 12px 40px rgba(20,32,27,.12); }
  .mark { width: 56px; height: 56px; border-radius: 16px; background: #0C7A55; display: grid; place-items: center; }
  h1 { font-size: 23px; margin: 16px 0 6px; }
  .muted { color: #5F6C66; }
  ol { padding-left: 20px; margin: 14px 0 0; } li { margin: 8px 0; }
</style></head>
<body><main><div class="card">
  <div class="mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="8" r="2.4"/><circle cx="17" cy="8" r="2.4"/><circle cx="12" cy="17" r="2.4"/><path d="M9.3 9.4l1.5 5.3M14.7 9.4l-1.5 5.3M9.5 8h5"/></svg></div>
  <h1>Pair this device first</h1>
  <p class="muted">For your safety, Crew only opens on devices you have paired.</p>
  <ol>
    <li>On the computer running Crew, open <b>Settings → Use on your phone</b>.</li>
    <li>Switch on <b>Allow my phone to open Crew</b>.</li>
    <li>Scan the code with this phone’s camera and tap the link.</li>
  </ol>
</div></main></body></html>
