<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C7A55">
<meta name="color-scheme" content="light dark">
<title>Crew</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/app.css">
<script>
  // Apply the saved look before anything paints (no flash of the wrong theme).
  try {
    var t = localStorage.getItem('crew.theme'), a = localStorage.getItem('crew.accent');
    if (t && t !== 'system') document.documentElement.dataset.theme = t;
    if (a && a !== 'green') document.documentElement.dataset.accent = a;
  } catch (e) {}
</script>
</head>

<header class="topbar" id="topbar">
  <span class="brand-mini"><svg class="i"><use href="#i-logo"/></svg></span>
  <b id="topTitle">Crew</b>
  <button class="btn icon ghost" id="topBrowser" title="Browser" aria-label="Open the browser"><svg class="i"><use href="#i-globe"/></svg></button>
  <a class="btn icon ghost" href="#/settings" title="Settings" aria-label="Settings"><svg class="i"><use href="#i-settings"/></svg></a>
</header>

<div class="shell" id="shell">
  <aside class="side" aria-label="Main menu">
    <div class="brand"><span class="mark"><svg class="i"><use href="#i-logo"/></svg></span><b>Crew</b></div>
    <a class="newbtn" href="#/assistant/new" id="newBtn"><svg class="i"><use href="#i-plus"/></svg>New conversation</a>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="home"><svg class="i"><use href="#i-home"/></svg>Home</a>
      <a href="#/assistant" data-nav="assistant"><svg class="i"><use href="#i-chat"/></svg>Assistant</a>
      <a href="#/projects" data-nav="projects"><svg class="i"><use href="#i-layers"/></svg>Projects<span class="badge" id="liveBadge"></span></a>
      <a href="#/browser" data-nav="browser"><svg class="i"><use href="#i-globe"/></svg>Browser</a>
      <a href="#/phone" data-nav="phone"><svg class="i"><use href="#i-phone"/></svg>Phone</a>
      <a href="#/captures" data-nav="captures"><svg class="i"><use href="#i-camera"/></svg>Captures</a>
      <a href="#/skills" data-nav="skills"><svg class="i"><use href="#i-sparkles"/></svg>Skills</a>
    </nav>
    <h6>Recent</h6>
    <div class="recent" id="recent"></div>
    <div class="foot">
      <a class="btn ghost sm grow-btn" href="#/settings" data-nav="settings"><svg class="i"><use href="#i-settings"/></svg>Settings</a>
      <button class="btn ghost icon sm" id="themeBtn" title="Light or dark" aria-label="Switch between light and dark"><svg class="i"><use href="#i-moon"/></svg></button>
    </div>
  </aside>

  <main class="view" id="view" tabindex="-1"></main>

  <aside class="panel" id="panel" aria-label="Side panel">
    <div class="panel-head">
      <div class="seg" id="panelTabs">
        <button data-tab="browser"><svg class="i"><use href="#i-globe"/></svg> Browser</button>
        <button data-tab="phone"><svg class="i"><use href="#i-phone"/></svg> Phone</button>
        <button data-tab="preview"><svg class="i"><use href="#i-doc"/></svg> Preview</button>
      </div>
      <span class="grow"></span>
      <button class="btn icon ghost" id="panelMax" title="Make wider" aria-label="Make the panel wider"><svg class="i"><use href="#i-expand"/></svg></button>
      <button class="btn icon ghost" id="panelClose" title="Close" aria-label="Close the panel"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>

<nav class="tabbar" id="tabbar" aria-label="Main menu">
  <a href="#/" data-nav="home"><svg class="i"><use href="#i-home"/></svg>Home</a>
  <a href="#/assistant" data-nav="assistant"><svg class="i"><use href="#i-chat"/></svg>Assistant</a>
  <a href="#/projects" data-nav="projects"><svg class="i"><use href="#i-layers"/></svg>Projects</a>
  <a href="#/captures" data-nav="captures"><svg class="i"><use href="#i-camera"/></svg>Captures</a>
  <a href="#/more" data-nav="more"><svg class="i"><use href="#i-apps"/></svg>More</a>
</nav>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="recbar"></div>
<noscript><p style="padding:24px">Crew needs JavaScript switched on.</p></noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
